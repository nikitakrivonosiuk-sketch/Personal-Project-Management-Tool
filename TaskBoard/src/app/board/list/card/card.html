@if (cardData) {
    <div class="flex flex-col gap-3 p-4 bg-white border border-gray-200 rounded-xl shadow-xs hover:shadow-md transition-shadow">
        <div class="flex items-center justify-between w-full">
            <h3 class="text-lg truncate"> {{cardData.title}} </h3>

            <app-context-menu>
                <button type="button" class="flex items-center gap-2 w-full px-2.5 py-1.5 text-xs font-semibold text-gray-700 bg-gray-50 
                                            hover:bg-gray-100 rounded-lg transition-colors cursor-pointer text-left">
                    <img src="edit-icon.png" alt="edit-icon" class="w-5 h-5 object-contain shrink-0">
                    <span class="text-sm"> Edit </span>
                </button>
                
                <button type="button" class="flex items-center gap-2 w-full px-2.5 py-1.5 text-xs font-semibold text-red-600 bg-gray-50 
                                            hover:bg-red-100 rounded-lg transition-colors cursor-pointer text-left">
                    <img src="delete-icon.png" alt="delete-icon" class="w-5 h-5 object-contain shrink-0">
                    <span class="text-sm"> Delete </span>
                </button>
            </app-context-menu>
        </div>
    
        <p class="text-gray-500">
            {{cardData.description}}
        </p>
    
        <div class="flex gap-3 h-full items-center">
            <img src="calendar-icon.png" alt="calendar icon" class="object-contain w-6 h-6">
            <span class="text-base text-gray-700 "> {{cardData.dueDate | date: "EEEEEE, d MMM"}} </span>
        </div>
    
        <div class="flex items-center ">
            <span class="inline-flex bg-gray-200 items-center gap-2 px-2  rounded-xl">
                @if(cardData.priority === 'low'){
                    <span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span>
                }
                @else if (cardData.priority === 'medium') {
                    <span class="w-1.5 h-1.5 rounded-full bg-gray-500"></span>
                }
                @else if (cardData.priority === 'high') {
                    <span class="w-1.5 h-1.5 rounded-full bg-gray-800"></span>
                }
                {{cardData.priority}}
            </span>
        </div>
    
        
    
    </div>
}
