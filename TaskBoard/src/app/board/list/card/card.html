@if (cardData) {
    <div (click)="onViewCard()" class="flex flex-col w-full gap-3 p-4 bg-white border border-gray-300 rounded-xl shadow-xs 
    hover:shadow-md transition-shadow cursor-pointer">            
            <div class="flex items-center justify-between w-full">
                <h3 class="text-lg font-medium truncate"> {{cardData.title}} </h3>
    
                <app-context-menu (click)="$event.stopPropagation()">
                    <button (click)="onEditCard()" type="button" class="flex items-center gap-2 w-full px-2.5 py-1.5 text-xs font-semibold text-gray-700 bg-gray-50 
                                                hover:bg-gray-100 rounded-lg transition-colors cursor-pointer text-left">
                        <img src="edit-icon.png" alt="edit-icon" class="w-5 h-5 object-contain shrink-0">
                        <span class="text-sm"> Edit </span>
                    </button>
                    
                    <button (click)="onDeleteCard()" type="button" class="flex items-center gap-2 w-full px-2.5 py-1.5 text-xs font-semibold text-red-600 bg-gray-50 
                                                hover:bg-red-100 rounded-lg transition-colors cursor-pointer text-left">
                        <img src="delete-icon.png" alt="delete-icon" class="w-5 h-5 object-contain shrink-0">
                        <span class="text-sm"> Delete </span>
                    </button>
                </app-context-menu>
            </div>
        
            <p class="text-gray-500 text-start py-1 break-words">
                {{cardData.description}}
            </p>
        
            <div class="flex gap-3 h-full items-center py-1">
                <img src="calendar-icon.png" alt="calendar icon" class="object-contain w-6 h-6">
                <span class="text-base text-gray-700 "> {{cardData.dueDate | date: "EEEEEE, d MMM"}} </span>
            </div>
        
            <!-- Card priority -->
            <div class="flex items-center py-1">
                <span class="inline-flex bg-gray-200 items-center gap-2 px-2  rounded-xl">
                    @if(cardData.priority === 'Low'){
                        <span class="w-1.5 h-1.5 rounded-full bg-gray-300"></span>
                    }
                    @else if (cardData.priority === 'Medium') {
                        <span class="w-1.5 h-1.5 rounded-full bg-gray-500"></span>
                    }
                    @else if (cardData.priority === 'High') {
                        <span class="w-1.5 h-1.5 rounded-full bg-gray-800"></span>
                    }
                    {{cardData.priority}}
                </span>
            </div>

            <!-- Card list moving -->
            <div (click)="$event.stopPropagation()" class="bg-gray-200 rounded-md">
                <select  (change)="onMoveCard($event)" class="w-full px-2 h-10 text-gray-800 font-semibold">
                    <option disabled selected hidden> Move to:</option>
                    @for (list of lists; track list.id) {
                        <option [value]="list.id">{{list.title}}</option>
                    }
                </select>
            </div>
        </div>
}
