@if (listData){
    <div class="flex flex-col gap-3 w-80 shrink-0 p-2 bg-white rounded-xl">
    
        <div class="flex items-center justify-between w-full border-t-2 border-b-2 py-2 border-gray-200">
            <h2 class="text-base text-lg"> {{listData.title}} </h2>

            <app-context-menu>
                <button type="button" class="flex items-center gap-2 w-full px-2.5 py-1.5 text-xs font-semibold text-gray-700 bg-gray-50 
                                            hover:bg-gray-100 rounded-lg transition-colors cursor-pointer text-left">
                    <img src="edit-icon.png" alt="edit-icon" class="w-5 h-5 object-contain shrink-0">
                    <span class="text-sm"> Edit </span>
                </button>
                
                <button type="button" class="flex items-center gap-2 w-full px-2.5 py-1.5 text-xs font-semibold text-red-600 bg-gray-50 
                                            hover:bg-red-100 rounded-lg transition-colors cursor-pointer text-left">
                    <img src="delete-icon.png" alt="delete-icon" class="w-5 h-5 object-contain shrink-0">
                    <span class="text-sm"> Delete </span>
                </button>
            </app-context-menu>
        </div>
    
        <button class="inline-flex gap-6 items-center p-2  
        border-dashed bg-white border border-gray-400 rounded-md shadow-sm hover:bg-gray-100 hover:text-gray-900 transition-colors
        active:bg-gray-300 cursor-pointer">
            <img src="add-icon.png" alt="Add icon" class="w-6 h-6 object-contain">
            <span> Add new card </span>
        </button>
    
        <div class="flex flex-col gap-2">
            @for (card of listData.cards; track card.id) {
                <app-card [cardData]="card"/>
            }
        </div>
    </div>
}
