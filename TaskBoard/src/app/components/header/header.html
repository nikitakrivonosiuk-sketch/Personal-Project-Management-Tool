<header class="flex items-center justify-between w-full px-6 py-3 bg-white border-b border-gray-100">
    <h1 [routerLink]="['/boards']" class="text-2xl tracking-tight font-semibold text-gray-900 hover:bg-gray-50 rounded-md p-1 cursor-pointer">
        My Task Board
    </h1>

    <div class="flex gap-3">
        @if (activeBoardId()) {
            <div class="flex gap-3">
                <button type="button" (click)="addMembers.emit()" class="inline-flex items-center gap-2 px-3.5 py-1.5 text-lg font-medium text-gray-700 bg-white border border-gray-200 rounded-md shadow-sm hover:bg-gray-50 hover:text-gray-900 transition-colors cursor-pointer active:bg-gray-200">
                    <span class="material-symbols-outlined">person_add</span>
                    <span> Add User </span>
                </button>
                
                <button type="button" (click)="toggle()" class="inline-flex items-center gap-2 px-3.5 py-1.5 text-lg font-medium text-gray-700 bg-white border border-gray-200 rounded-md shadow-sm hover:bg-gray-50 hover:text-gray-900 transition-colors cursor-pointer">
                    <span class="material-symbols-outlined">history</span>
                    <span> History </span>
                </button>
            </div>
        }
    
        @if (logoutShow()){
            <button type="button" (click)="logout.emit()"
                class="inline-flex items-center gap-2 px-3.5 py-1.5 text-lg font-medium text-gray-700 bg-white border border-gray-200 rounded-md shadow-sm hover:bg-red-100 transition-colors cursor-pointer">
                <span class="material-symbols-outlined">logout</span>
                <span> Logout </span>
            </button>
        }
    </div>
</header>

@if (activeBoardId()) {
    <app-history-bar [(isOpened)]="historyState" [boardId]="activeBoardId()!"/>
}
