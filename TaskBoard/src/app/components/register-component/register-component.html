<div class="grid grid-cols-1 md:grid-cols-3 min-h-screen">
    <div class="md:col-span-2 relative h-64 md:h-full">
        <img src="signup-left-illustration.png" alt="sign up image" class="w-full h-full object-cover">
    </div>
    
    <div>
        <main class="grid min-h-screen place-items-center bg-slate-200">
            <section class="w-full max-w-md p-5 bg-white rounded-2xl shadow-xl">
                <h1 class="text-2xl font-bold">
                    Sign up
                </h1>
                <p class="mt-2 text-sm text-slate-500">
                    Sign up to log in to your boards
                </p>
        
                <form class="mt-8 space-y-5" [formGroup]="registerForm" (ngSubmit)="onSubmit()">
                    <div>
                        <label for="email" class="mb-2 block text-sm font-medium text-slate-600"> Email</label>
                        <input type="email" id="email"
                        placeholder="name@example.com"
                        formControlName="email"
                        class="w-full border border-slate-300 p-2 outline-none rounded-lg
                        focus:border-slate-500 focus:ring-2 focus:ring-slate-200">
                    </div>
        
                    <div>
                        <label for="password"
                        class="mb-2 block text-sm font-medium text-slate-600">
                            Password
                        </label>
                        <input type="password" id="password"
                        placeholder="Enter password"
                        formControlName="password"
                        class="w-full border border-slate-300 p-2 outline-none rounded-lg
                        focus:border-slate-500 focus:ring-2 focus:ring-slate-200">
                    </div>
        
                    <button type="submit" 
                    class="w-full rounded-lg text-slate-900 p-2 mt-3 bg-gray-200 font-semibold transition
                    hover:bg-gray-300 cursor-pointer hover:outline-none focus:ring-1 focus:ring-offset-2">
                        Sign up
                    </button>
                </form>
        
                <p class="text-center text-sm font-medium mt-5 text-slate-600">
                    Already have account?
                    <a routerLink="/login" class="font-medium text-base text-slate-600 hover:text-slate-900"> Login </a>
                </p>
            </section>
        </main>
    </div>
</div>
