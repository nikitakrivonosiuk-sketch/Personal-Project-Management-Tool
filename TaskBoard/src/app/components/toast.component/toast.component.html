<div class="fixed top-5 right-5 z-60 flex flex-col gap-3">
  @for (toast of toasts$ | async; track toast.id) {
    <div 
    class="inline-flex justify-between w-full p-4 rounded-lg text-white gap-5 shadow-xl animate-slide-in"
    [class.bg-green-400]="toast.toastType === 2" 
    [class.bg-red-400]="toast.toastType === 0"
    [class.bg-blue-400]="toast.toastType === 3"
    [class.bg-yellow-400]="toast.toastType === 1">
        
       <span class="material-symbols-outlined"> {{iconMap[toast.toastType]}} </span>

       <span class="font-medium">
        {{toast.message}}
       </span>

       <span class="material-symbols-outlined hover:opacity-75 rounded-lg cursor-pointer" (click)="close(toast.id)">close</span>
    </div>
  }
</div>
