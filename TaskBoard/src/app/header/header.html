<app-history-bar [(isOpened)]="historyState"/>

<header class="flex items-center justify-between w-full px-6 py-3 bg-white border-b border-gray-100">
    <h1 class="text-2xl tracking-tight font-semibold text-gray-900">
        My Task Board
    </h1>
    <button type="button" (click)="toggle()" class="inline-flex items-center gap-2 px-3.5 py-1.5 text-lg font-medium text-gray-700 bg-white border border-gray-200 rounded-md shadow-sm 
    hover:bg-gray-50 hover:text-gray-900 transition-colors cursor-pointer">
        <img src="history-icon.png" alt="History icon" class="w-6 h-6 object-contain">
        <span> History </span>
    </button>
</header>
