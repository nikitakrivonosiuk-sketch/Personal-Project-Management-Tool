@if(isOpened()) {
    <div class="fixed inset-0 z-50 overflow-hidden">
        <div (click)="close()" class="absolute bg-black/30 w-full h-full transition-opacity"></div>

            <div class="absolute inset-y-0 right-0 w-96 h-full flex shrink-0">
                <div class="bg-gray-100 shadow-2xl flex flex-col">
                    <div class="flex items-center justify-between px-5 py-3 bg-gray-600 text-white">
                        <h2 class="text-lg font-medium tracking-wide"> History </h2>
                        <button type="button" (click)="close()">
                            <img src="close-icon.png" alt="close icon" class="w-4 h-4 object-contain cursor-pointer">
                        </button>
                    </div>

                    <div class="flex-1 overflow-y-auto shrink-0 p-4">
                        @for (log of activityLogs(); track log.id) {
                            <div class="flex items-center gap-3 mb-4 w-full">
                                <span class="w-1.5 h-1.5 rounded-full bg-gray-400 shrink-0"></span>
                                <div class="flex flex-col">
                                    <p class="text-base text-gray-500 leading-tight">
                                        {{log.description}}
                                    </p>
                                    <small class="text-gray-500"> {{log.createdAt | date:'short'}}</small>
                                </div>
                            </div>
                        }
                        <div class="p-4">
                            <button (click)="loadMore()" class="flex items-center justify-center w-full py-2 px-4 gap-3 border-gray-300 border-2 rounded-sm cursor-pointer
                            hover:bg-gray-100 transition-colors active:bg-gray-200 shadow-xs">
                                <img src="more-icon.png" alt="More icon" class="w-4 h-4 object-contain">
                                <span class="text-base font-medium tracking-wide"> Show more </span>
                            </button>
                        </div>
                    </div>
                </div>
            </div>
    </div>
}
