@if(isOpened()) {
    <div class="fixed inset-0 z-50 overflow-hidden">
        <div (click)="close()" class="absolute bg-black/30 w-full h-full transition-opacity"></div>

            <div class="absolute inset-y-0 right-0 flex">
                <div class="bg-white shadow-2xl flex flex-col">
                    <div class="flex items-center justify-between w-100 bg-gray-100 px-5 py-3 bg-slate-600 text-lg text-white">
                        <h2 class="text-lg font-semibold"> History </h2>
                        <button type="button" (click)="close()">
                            <img src="close-icon.png" alt="close icon" class="w-4 h-4 object-contain cursor-pointer">
                        </button>
                    </div>



                    <div class="p-4">
                        <button class="flex items-center justify-center w-full py-2 px-4 gap-3 border-gray-300 border-2 rounded-sm cursor-pointer
                        hover:bg-gray-100 transition-colors active:bg-gray-200 shadow-xs">
                            <img src="more-icon.png" alt="More icon" class="w-4 h-4 object-contain">
                            <span class="text-base font-medium tracking-wide"> Show more </span>
                        </button>
                    </div>
                </div>
            </div>
    </div>
}
