services:
  api: 
    image: ${ACR_NAME}.azurecr.io/taskboard-api:latest
    restart: unless-stopped
    environment:
      KeyVault__Uri: https://${KV_NAME}.vault.azure.net/
    expose:
      - "8080"

  web:
    image: ${ACR_NAME}.azurecr.io/taskboard-web:latest
    restart: unless-stopped
    ports:
      - "80:80"
    depends_on:
      - api